<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Escribe una reseña">
    <meta name="author" content="Autor">
    <meta name="keywords" content="html, formulario, reseña, valoración, opiniones">
    <title>Escribe una reseña</title>
</head>
<body>

<header>
    <h1>Escribe una reseña</h1>
</header>

<nav>
</nav>

<main>
    <section>
        <article>
            <form action="#" method="post">
                
                <label>Su nombre:</label><br>
                <input type="text" name="nombre" placeholder="Nombre completo">
                <br><br>

                <label>Correo electrónico:</label><br>
                <input type="text" name="correo" placeholder="correo@ejemplo.com">
                <br><br>

                <label>Valoración (Puntuación):</label><br>
                <select name="valoracion">
                    <option value="5" selected>5 (5/5 - Excelente)</option>
                    <option value="4">4 (4/5 - Muy bueno)</option>
                    <option value="3">3 (3/5 - Bueno)</option>
                    <option value="2">2 (2/5 - Regular)</option>
                    <option value="1">1 (1/5 - Malo)</option>
                </select>
                <br><br>

                <label>Título de la reseña:</label><br>
                <input type="text" name="titulo_resenha" placeholder="Resumen de tu experiencia">
                <br><br>

                <label>Comentario:</label><br>
                <textarea name="comentario" placeholder="Escribe aquí tu opinión detallada..." rows="6" cols="50"></textarea>
                <br><br>

                <div>
                    <input type="submit" value="ENVIAR RESEÑA">
                </div>

            </form>
        </article>
    </section>

    <aside>
    </aside>
</main>

<footer>
    <a href="../index.html">Volver al Menú de practicas.</a>
    © 2026
</footer>

</body>
</html>
